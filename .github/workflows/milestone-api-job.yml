name: Milestone API Job

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-api-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run milestone job
        run: python automation/milestone_api_job.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: milestone-output
          path: milestone-output.json
